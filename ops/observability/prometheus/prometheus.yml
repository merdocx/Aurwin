# Конфигурация Prometheus (ТЗ 6.1, А.7, фаза 7 «Эксплуатация»).
# Скрейпит sim-engine и reflection-worker по именам сервисов docker-compose
# (внутренняя сеть, порты наружу не публикуются — тот же принцип, что и
# для Postgres в CLAUDE.md/А.7). api-gateway метрик не экспортирует — это
# read-only слой без собственных доменных метрик симуляции (не входит в
# список 6.1); при необходимости базовых HTTP-метрик добавляется отдельно.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sim-engine
    static_configs:
      - targets: ["sim-engine:9464"]

  - job_name: reflection-worker
    static_configs:
      - targets: ["reflection-worker:9465"]
