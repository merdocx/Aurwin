name: aurwin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aurwin
    # WAL-архивация (А.7, фаза 7): дополняет плановый pg_dump (ops/backup/pg_dump.sh)
    # point-in-time recovery между дампами. wal_archive — именованный volume
    # (не bind-mount) — WAL-файлы не должны попасть в git по ошибке.
    #
    # Docker создаёт новый именованный volume с владельцем root:root — процесс
    # archiver сервера Postgres работает от uid postgres (70), поэтому без
    # chown ниже archive_command молча (для sim-engine/наблюдателя) падает на
    # каждом сегменте с "Permission denied" (обнаружено живым прогоном WAL-
    # архивации в этой фазе, см. ops/DEVIATIONS.md). command переопределён на
    # shell-обёртку: chown выполняется, пока entrypoint ещё root, затем
    # управление передаётся штатному docker-entrypoint.sh postgres (тот сам
    # опускает привилегии до postgres через gosu, как и раньше).
    command:
      - sh
      - -c
      - >-
        chown postgres:postgres /wal-archive &&
        exec docker-entrypoint.sh postgres
        -c wal_level=replica
        -c archive_mode=on
        -c 'archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal-archive
    # Порт наружу НЕ публикуется (CLAUDE.md / ТЗ А.7): Postgres доступен только
    # другим сервисам этого docker-compose по имени "postgres" во внутренней сети.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurwin -d aurwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  sim-engine:
    build:
      context: .
      dockerfile: services/sim-engine/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # sim-engine — единственный писатель игрового состояния (А.1): пишет
      # напрямую в Postgres по имени сервиса "postgres" во внутренней сети
      # compose (порт наружу не публикуется, CLAUDE.md/А.7).
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aurwin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: aurwin
    depends_on:
      postgres:
        condition: service_healthy

  reflection-worker:
    build:
      context: .
      dockerfile: services/reflection-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Фаза 6: reflection-worker подключается к Postgres напрямую (общая БД
      # с sim-engine, А.1) — те же PG*-переменные, что и sim-engine/api-gateway
      # (ранее отсутствовали здесь: до фазы 6 этот процесс был заглушкой без
      # реальных обращений к БД, см. ops/DEVIATIONS.md, фаза 6).
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aurwin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: aurwin
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # api-gateway — только читатель БД (А.1): те же PG*-переменные, что и
      # sim-engine, но эта служба никогда не пишет игровое состояние.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aurwin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: aurwin
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api-gateway

  # Не долгоживущий сервис — только для `docker compose run --rm db-maintenance
  # <команда>` (миграции, ops/systemd/aurwin-retention.timer -> npm run
  # maintenance:run). profiles: ["tools"] исключает его из обычного
  # `docker compose up -d` (см. docker docs: команда run игнорирует профиль
  # явно указанного сервиса, поэтому вызов через run работает без --profile).
  db-maintenance:
    build:
      context: .
      dockerfile: services/db/Dockerfile
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aurwin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: aurwin
    depends_on:
      postgres:
        condition: service_healthy

  # --- Наблюдаемость (ТЗ 6.1, А.7, фаза 7 «Эксплуатация») ---
  # sim-engine (:9464) и reflection-worker (:9465) отдают /metrics во внутренней
  # сети compose — портов наружу для них нет, только Prometheus/Grafana.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - sim-engine
      - reflection-worker

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  wal_archive:
  prometheus_data:
  grafana_data:
