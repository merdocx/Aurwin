# config/constants.yaml
#
# Единый источник правды для всех констант симуляции Aurwin.
# Источник: docs/AURWIN_TZ.md, Приложение А.9 («Сводная таблица констант»).
#
# Правила (см. CLAUDE.md, «Незыблемые правила», п.3-4):
#   - Никакие числа из этого файла не дублируются и не хардкодятся в коде.
#   - Значение меняется только здесь; каждое изменение фиксируется в ops/BALANCE_LOG.md
#     (когда, что, почему) — раздел 9 ТЗ прямо предполагает итеративную балансировку,
#     и без журнала нельзя будет связать правку параметра с изменением динамики экосистемы.
#   - Если тест не проходит из-за значения константы — чинится логика, либо расхождение
#     с ТЗ фиксируется в ops/DEVIATIONS.md с обоснованием. Константа "под тест" не подгоняется.
#
# Комментарий у каждой константы: обоснование из А.9 + чувствительность
# (что крутить первым при разбалансировке — низкая/средняя/высокая).

time:
  # Визуальный тик, сек. Плавность при интерполяции на фронтенде, комфортная нагрузка.
  # Чувствительность: низкая.
  visual_tick_seconds: 2

  # Ускорение биочасов: ×7 (1 реальный день = 1 внутренняя неделя).
  # Раздел 6.2: история существа накапливается за разумный наблюдаемый срок.
  # Чувствительность: высокая — меняет всё расписание жизни.
  biological_clock_speedup: 7

  # Длительность внутренних суток, реальных часов (≈ 1/7 суток).
  # ~7 смен дня/ночи за реальные сутки — ритм заметен, но не мельтешит (7.10).
  # Чувствительность: средняя.
  inner_day_real_hours: 3.4

  # Снапшот состояния мира в БД, раз в N тиков (~1 минута при визуальном тике 2 сек).
  # Потеря ≤ 1 минуты жизни мира допустима при рестарте (А.7).
  # Чувствительность: низкая.
  snapshot_interval_ticks: 30

population:
  # Genesis-популяция при первом запуске мира.
  # Нижняя треть целевых диапазонов (6.2) — оставляет место для естественного роста.
  # Чувствительность: средняя.
  genesis:
    penguins: 40
    orcas: 4

  # Пороги алёрта численности — видоспецифичные: общий порог "< 5" ложно
  # срабатывал бы на касатках, чей нормальный диапазон 3-8 (А.7).
  # Чувствительность: низкая.
  alert_thresholds:
    penguins: { min: 10, max: 120 }
    orcas: { min: 2, max: 12 }

  # Порог реинтродукции — защита от "мёртвого мира" на публичном 24/7-сайте (7.4).
  # При падении вида ниже alert-порога — алёрт команде; при 0 — реинтродукция
  # (новая genesis-когорта). Каждый случай реинтродукции обязателен к разбору
  # как провал балансировки (7.4).
  # Чувствительность: средняя.
  reintroduction:
    penguins_alert_below: 10
    orcas_alert_below: 2
    reintroduce_at: 0

reflection:
  # Дельта дрейфа черты характера за одну рефлексию: clamp ±0.1.
  # Заметный, но не мгновенный сдвиг личности (7.3).
  # Чувствительность: средняя.
  trait_delta_clamp: 0.1

  # Пожизненный коридор дрейфа черты: ±0.6 от врождённого значения.
  # Защита от насыщения черт у долгожителей; врождённый темперамент — основа (7.7, А.9).
  # Чувствительность: средняя.
  trait_lifetime_corridor: 0.6

  # Дельта индивидуального веса решения (w_need/w_trait/w_habit) за рефлексию: ±0.05.
  # Способ взвешивания решений меняется, но не до неузнаваемости.
  # Чувствительность: средняя.
  weight_delta_clamp: 0.05

  # Пожизненный коридор дрейфа веса: ±0.3 от врождённого значения.
  # Чувствительность: средняя.
  weight_lifetime_corridor: 0.3

  # Дебаунс событийной рефлексии: не чаще 1 раза на существо за N реальных часов.
  # Каскад событий в окне дебаунса сливается в один вызов LLM (дешевле и правдоподобнее — 7.3).
  # Чувствительность: средняя.
  event_debounce_hours: 4

  # Глобальный лимит событийных рефлексий — двухуровневая защита бюджета:
  # часовой лимит защищает от всплеска, суточный — от утечки бюджета
  # (без суточного капа худший месяц мог бы стоить ~$130 вместо ~$20-25).
  # Чувствительность: высокая для бюджета.
  event_global_limit_per_hour: 30
  event_global_limit_per_day: 120

  # Интервал фоновой рефлексии: раз в 24 реальных часа для всех существ.
  # Примерно раз во внутреннюю неделю жизни существа (6.2).
  # Чувствительность: высокая для бюджета и глубины самосознания.
  background_interval_hours: 24

  # Плановый суточный расход на LLM-рефлексию, USD (ориентир из 7.6).
  llm_daily_budget_usd: 0.40

  # Алёрт расхода LLM: превышение планового суточного расхода в N раз —
  # ранний сигнал утечки бюджета (А.7, А.9).
  # Чувствительность: низкая.
  llm_budget_alert_multiplier: 2

memory:
  # Лимит эпизодов в эпизодической памяти — пропорционально длине жизни вида.
  # Чувствительность: низкая.
  episodic_limit:
    penguin: 50
    orca: 80

  # Затухание значимости записи эпизодической памяти за сутки (множитель).
  # Полураспад значимости соразмерен продолжительности жизни вида.
  # Чувствительность: средняя.
  significance_decay_per_day:
    penguin: 0.90
    orca: 0.97

  # Порог значимости для перевода эпизода в core_memory (не подлежит забыванию).
  # Ключевые травмы/радости не должны исчезать со временем.
  # Чувствительность: низкая.
  core_memory_significance_threshold: 0.9

utility_ai:
  # Максимальная амплитуда случайного шума в utility-функции реактивного слоя (уровень 1).
  # Строго меньше вклада черт характера — живость поведения без потери
  # атрибутируемости решений (цель 2 раздела 2).
  # Чувствительность: средняя.
  noise_epsilon_max: 0.05

world:
  # Размер карты, условные единицы (у.е.). 5 именованных зон — геометрия в А.10.
  # Чувствительность: высокая — влияет на всю динамику мира.
  map:
    width: 2000
    height: 1200

  # Респавн рыбы, единиц/тик, по зонам. Асимметрия между north_bay (богатая, но
  # опасная — частый заход касаток) и south_shallows (бедная, но безопасная)
  # создаёт настоящий выбор "риск/выгода" (А.9, А.10).
  # Остальные зоны (main_ice, open_water, far_ice) кормовой ценности не имеют.
  # Чувствительность: высокая — главный рычаг баланса экосистемы.
  fish_respawn_per_tick:
    north_bay: 0.04
    south_shallows: 0.015

  # Базовая вероятность успеха охоты касатки при контакте с пингвином (до
  # модификаторов навыка/сигналов/кооперации из А.10). Хищник результативен,
  # но не тотален — иначе бегство перестанет быть осмысленной стратегией.
  # Чувствительность: высокая — второй по значимости рычаг баланса.
  base_hunt_success_probability: 0.35

  # Именованные зоны карты и их доли площади (А.10). Порядок ниже задаёт
  # раскладку зон полосами слева направо вдоль ширины карты (см.
  # services/sim-engine/src/world/zones.ts) — сама раскладка не из ТЗ
  # дословно (там заданы только доли), см. ops/DEVIATIONS.md.
  # Чувствительность: высокая — влияет на всю пространственную динамику.
  zones:
    far_ice: { type: ice, share: 0.05 }
    main_ice: { type: ice, share: 0.30 }
    north_bay: { type: water, share: 0.20 }
    south_shallows: { type: water, share: 0.20 }
    open_water: { type: water, share: 0.25 }

social:
  # Порог силы связи (bond), с которого она считается дружбой.
  # Ниже 0.2 связь распадается. Дружба возникает не мгновенно, но достижима.
  # Чувствительность: средняя.
  friendship:
    threshold: 0.4
    decay_below: 0.2

life_stages:
  # Возрастные стадии, внутренних недель (детство/зрелость/старость) — А.9/А.10.
  # Чувствительность: средняя.
  penguin_weeks: { juvenile: 1.5, adult: 7, old: 10 }
  orca_weeks: { juvenile: 5, adult: 22, old: 30 }

  # Эффективность самокормления детёныша: множитель к успеху добычи.
  # Детёныш способен прокормиться сам, пусть и плохо — если бы он полностью
  # зависел от родителя, забота (provision, 7.9) стала бы условием выживания,
  # а не преимуществом, подлежащим отбору (7.4).
  # Чувствительность: высокая — влияет на выживаемость молодняка.
  juvenile_self_feeding_efficiency: 0.3

movement:
  # Скорость передвижения в воде, у.е./тик. Касатка обязана быть быстрее
  # пингвина, иначе охота как событие теряет смысл (бегство всегда побеждает).
  # Чувствительность: высокая.
  water_speed:
    penguin: 14
    orca: 22

  # Скорость передвижения пингвина по льду, у.е./тик (А.10). У касаток льда
  # не бывает — поля для касатки нет.
  # Чувствительность: средняя.
  ice_speed:
    penguin: 6

  # Множитель скорости в стадии "старый" — снижение подвижности с возрастом
  # (А.10), общий для обоих видов.
  # Чувствительность: средняя.
  old_age_speed_multiplier: 0.7

  # stealth_approach: компромисс скорости и скрытности — медленнее движение
  # в обмен на заниженную воспринимаемую жертвой угрозу.
  # Чувствительность: высокая — влияет на баланс охоты.
  stealth_approach:
    speed_multiplier: 0.6
    perceived_threat_multiplier: 0.4

decision_log:
  # Постоянный семплинг лога решений: N существ пишутся всегда + окна после
  # значимых событий, TTL записи — сутки. Без семплинга — порядка 3.9 млн
  # строк/сутки при целевой популяции.
  # Чувствительность: низкая.
  sampled_creatures_count: 10
  ttl_days: 7

skills:
  # Рост навыка за успешное применение действия и потолок роста.
  # Специализация особи заметна за недели практики, но не абсолютна (7.7).
  # Чувствительность: средняя.
  growth_per_success: 0.02
  cap: 0.9

  # Затухание навыка без практики, за сутки. Не даёт навыку "прилипнуть" навсегда.
  # Чувствительность: средняя.
  decay_per_day: 0.002

  # Влияние навыка на исход действия: множитель = base + skill_weight × skill.
  # Опытная особь успешнее, но новичок не беспомощен.
  # Чувствительность: средняя.
  outcome_multiplier:
    base: 0.6
    skill_weight: 0.8

  # Социальное обучение — распространение навыка через наблюдение и связи:
  # множитель к обучению для случайных очевидцев и для друзей по bond.
  # Личный опыт остаётся сильнее чужого, но опыт распространяется и формирует
  # "традиции" групп (7.7).
  # Чувствительность: высокая — формирует групповые traditions.
  social_learning:
    witness_multiplier: 0.4
    bonded_friend_multiplier: 0.25

signaling:
  # Стоимость сигнала display_vigor — доля текущего запаса энергии.
  # Гандикап-принцип: слабой особи сигнал обходится дороже, поэтому честность
  # сигнала частично поддерживается сама собой (7.8.2).
  # Чувствительность: высокая — определяет, насколько выгоден обман.
  display_vigor_cost_pct_energy: 0.08

  # Стоимость сигнала alarm_call — доля энергии; сигнал также повышает
  # заметность подающего для касаток. Ложная тревога не бесплатна.
  # Чувствительность: высокая.
  alarm_call_cost_pct_energy: 0.03

  # Сдвиг воспринимаемого состояния (бодрости) получателем сигнала:
  # прибавка = коэффициент × доверие (trust) к отправителю.
  # Сигнал работает тем сильнее, чем больше доверия.
  # Чувствительность: высокая.
  perceived_vigor_shift_per_trust: 0.35

  # Затухание воспринимаемого состояния обратно к истинной оценке, доля за тик.
  # Обман недолговечен и требует повторения сигнала (7.8.1).
  # Чувствительность: средняя.
  perceived_state_decay_per_tick: 0.05

  # Доверие (репутация источника сигнала): рост при подтверждении сигнала,
  # падение при опровержении. Репутация теряется втрое быстрее, чем набирается —
  # это регулирует выгодность систематического обмана (7.8.4).
  # Чувствительность: высокая.
  trust:
    gain_on_confirmation: 0.05
    loss_on_refutation: 0.15
    starting_value: 0.6

  # Черта expressiveness (склонность к подаче сигналов), диапазон.
  # Наследуется и мутирует — делает склонность к сигналам предметом
  # естественного отбора (7.8.5).
  # Чувствительность: средняя.
  expressiveness_trait_range: [-1, 1]

kinship:
  # Радиус охраны потомства, у.е. — половина дневного радиуса восприятия пингвина.
  # Чувствительность: средняя.
  offspring_guard_radius_units: 60

  # Эффект guard_offspring: снижает успех охоты хищника на охраняемого детёныша
  # и одновременно повышает заметность (риск) охраняющего родителя. Забота
  # должна реально стоить риска, иначе отбор её не заметит (7.9).
  # Чувствительность: высокая.
  guard_offspring:
    offspring_hunt_success_multiplier: 0.6
    parent_visibility_increase: true

  # Эффект coordinate_hunt: кооперативная охота отменяет групповую защиту
  # жертвы (переводит защитный множитель ×0.6 в ×1.0 для хищника).
  # Кооперация должна давать материальный выигрыш (7.9).
  # Чувствительность: высокая — влияет на баланс охоты.
  coordinate_hunt:
    group_defense_multiplier_without_coordination: 0.6
    group_defense_multiplier_with_coordination: 1.0

  # Глубина проверки родства при отборе партнёра/цели заботы: 1 поколение
  # (только прямые потомки). Полный родственный отбор — вне MVP (7.9).
  # Чувствительность: низкая.
  kinship_check_depth_generations: 1

day_night:
  # Радиус восприятия днём/ночью, у.е. Ночь опаснее для зрения, но эхолокация
  # касатки страдает меньше, чем зрение пингвина (7.10).
  # Чувствительность: высокая — влияет на ночную смертность.
  perception_radius:
    penguin: { day: 120, night: 70 }
    orca: { day: 200, night: 150 }

  # Множитель восприятия у спящей особи. Полусон китообразных (0.5) означает,
  # что спящий хищник не становится полностью беззащитным.
  # Чувствительность: высокая.
  asleep_perception_multiplier:
    penguin: 0.1
    orca: 0.5

  # Доступность рыбы ночью, множитель. Делает ночную кормёжку невыгодной —
  # у сна появляется экономический смысл (7.10).
  # Чувствительность: средняя.
  night_fish_availability_multiplier: 0.6

  # Восстановление энергии во время сна, множитель к обычному отдыху.
  # Сон должен окупать риск уязвимости во время сна.
  # Чувствительность: средняя.
  sleep_energy_recovery_multiplier: 2

  # Черта chronotype (склонность засыпать раньше/позже), диапазон.
  # Наследуется и мутирует; разброс хронотипов даёт естественных "дозорных"
  # без отдельной механики (7.10) — без разброса вся колония засыпала бы разом.
  # Чувствительность: высокая.
  chronotype_trait_range: [-1, 1]

  # Давление сна: рост за сутки бодрствования, снижение за сутки сна.
  # Полный цикл накопления/разрядки укладывается во внутренние сутки.
  # Чувствительность: средняя.
  sleep_pressure:
    gain_per_day_awake: 3.4
    loss_per_day_asleep: 10

  # Штраф усталости при давлении сна выше порога: множители к навыкам и скорости.
  # Невыспавшееся существо хуже добывает пищу и хуже спасается от хищника (7.10).
  # Чувствительность: средняя.
  fatigue_penalty:
    sleep_pressure_threshold: 0.7
    skill_multiplier: 0.8
    speed_multiplier: 0.85

retention:
  # Политика ретенции данных (docs/AURWIN_TZ.md, А.2, абзац "ПОЛИТИКА РЕТЕНЦИИ").
  # Эти значения не входят в таблицу А.9 дословно (они из текста А.2), но по
  # тому же правилу CLAUDE.md п.3 ("все константы симуляции — только в конфиге")
  # вынесены сюда, а не зашиты в скрипты обслуживания (services/db/src/maintenance).
  # Чувствительность: низкая — это сроки хранения, а не параметры баланса экосистемы.

  # episodes: полное удаление эпизодов через N реальных суток после смерти существа
  # (независимо от прунинга по значимости/лимиту при жизни).
  episodes_days_after_death: 30

  # world_events: полное хранение N реальных суток, далее сворачивание в
  # суточные агрегаты (world_events_daily_agg) вместо построчного хранения.
  world_events_full_days: 90

  # reflections: request/response (аудит промптов) обнуляются через N суток;
  # метаданные (kind, status, created_at, applied_at) хранятся без ограничения.
  reflections_audit_days: 30

  # signals: полное построчное хранение N суток, далее — только агрегаты
  # (доля неподтверждённых сигналов по видам, signals_daily_agg).
  signals_full_days: 30

authority:
  # Формула авторитетности особи как источника знания (для социального
  # обучения, 7.7): половина веса — прожитый возраст относительно
  # максимального для вида, половина — профильный навык. Ценен не возраст
  # сам по себе, а прожитый с толком.
  # Чувствительность: средняя.
  formula:
    age_weight: 0.5
    profile_skill_weight: 0.5

  # Вес авторитетности при передаче знания/традиции: множитель = 0.5 + 0.5 × authority.
  # Опыт старших весит больше, но не подавляет личный опыт получателя.
  # Чувствительность: средняя.
  transmission_weight:
    base: 0.5
    authority_weight: 0.5

  # Пересчёт авторитетности — раз во внутренние сутки, а не каждый тик:
  # величина меняется медленно, ежетиковый пересчёт был бы пустой нагрузкой.
  # Чувствительность: низкая.
  recompute_interval: "per_inner_day"
