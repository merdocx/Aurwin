# config/constants.yaml
#
# Единый источник правды для всех констант симуляции Aurwin.
# Источник: docs/AURWIN_TZ.md, Приложение А.9 («Сводная таблица констант»).
#
# Правила (см. CLAUDE.md, «Незыблемые правила», п.3-4):
#   - Никакие числа из этого файла не дублируются и не хардкодятся в коде.
#   - Значение меняется только здесь; каждое изменение фиксируется в ops/BALANCE_LOG.md
#     (когда, что, почему) — раздел 9 ТЗ прямо предполагает итеративную балансировку,
#     и без журнала нельзя будет связать правку параметра с изменением динамики экосистемы.
#   - Если тест не проходит из-за значения константы — чинится логика, либо расхождение
#     с ТЗ фиксируется в ops/DEVIATIONS.md с обоснованием. Константа "под тест" не подгоняется.
#
# Комментарий у каждой константы: обоснование из А.9 + чувствительность
# (что крутить первым при разбалансировке — низкая/средняя/высокая).

time:
  # Визуальный тик, сек. Плавность при интерполяции на фронтенде, комфортная нагрузка.
  # Чувствительность: низкая.
  visual_tick_seconds: 2

  # Ускорение биочасов: ×7 (1 реальный день = 1 внутренняя неделя).
  # Раздел 6.2: история существа накапливается за разумный наблюдаемый срок.
  # Чувствительность: высокая — меняет всё расписание жизни.
  biological_clock_speedup: 7

  # Длительность внутренних суток, реальных часов (≈ 1/7 суток).
  # ~7 смен дня/ночи за реальные сутки — ритм заметен, но не мельтешит (7.10).
  # Чувствительность: средняя.
  inner_day_real_hours: 3.4

  # Снапшот состояния мира в БД, раз в N тиков (~1 минута при визуальном тике 2 сек).
  # Потеря ≤ 1 минуты жизни мира допустима при рестарте (А.7).
  # Чувствительность: низкая.
  snapshot_interval_ticks: 30

population:
  # Genesis-популяция при первом запуске мира.
  # Нижняя треть целевых диапазонов (6.2) — оставляет место для естественного роста.
  # Чувствительность: средняя.
  genesis:
    penguins: 20
    orcas: 2

  # Пороги алёрта численности — видоспецифичные: общий порог "< 5" ложно
  # срабатывал бы на касатках, чей нормальный диапазон 3-8 (А.7).
  # Чувствительность: низкая.
  alert_thresholds:
    penguins: { min: 5, max: 60 }
    orcas: { min: 1, max: 6 }

  # Порог реинтродукции — защита от "мёртвого мира" на публичном 24/7-сайте (7.4).
  # При падении вида ниже alert-порога — алёрт команде; при 0 — реинтродукция
  # (новая genesis-когорта). Каждый случай реинтродукции обязателен к разбору
  # как провал балансировки (7.4).
  # Чувствительность: средняя.
  reintroduction:
    penguins_alert_below: 5
    orcas_alert_below: 1
    reintroduce_at: 0

  # Начальные потребности/эмоция genesis-особи (и реинтродукции) — ТЗ не
  # даёт числа для стартового состояния (только "стартовыми навыками около
  # нуля, нейтральными оценками зон" в 6.1), но раз стартовые значения
  # needs/emotion прямо влияют на первые тики жизни (баланс), они, как и
  # прочие числа симуляции, вынесены сюда, а не хардкожены (см.
  # ops/DEVIATIONS.md, фаза 4). Не голодная, не измотанная, слегка невыспавшаяся
  # особь — правдоподобная точка старта жизни.
  # Чувствительность: средняя.
  genesis_initial_needs: { hunger: 0.2, energy: 0.8, social: 0.3, sleep_pressure: 0.2 }
  genesis_initial_emotion: { valence: 0, arousal: 0.2 }

reflection:
  # Дельта дрейфа черты характера за одну рефлексию: clamp ±0.1.
  # Заметный, но не мгновенный сдвиг личности (7.3).
  # Чувствительность: средняя.
  trait_delta_clamp: 0.1

  # Пожизненный коридор дрейфа черты: ±0.6 от врождённого значения.
  # Защита от насыщения черт у долгожителей; врождённый темперамент — основа (7.7, А.9).
  # Чувствительность: средняя.
  trait_lifetime_corridor: 0.6

  # Дельта индивидуального веса решения (w_need/w_trait/w_habit) за рефлексию: ±0.05.
  # Способ взвешивания решений меняется, но не до неузнаваемости.
  # Чувствительность: средняя.
  weight_delta_clamp: 0.05

  # Пожизненный коридор дрейфа веса: ±0.3 от врождённого значения.
  # Чувствительность: средняя.
  weight_lifetime_corridor: 0.3

  # Дебаунс событийной рефлексии: не чаще 1 раза на существо за N реальных часов.
  # Каскад событий в окне дебаунса сливается в один вызов LLM (дешевле и правдоподобнее — 7.3).
  # 2026-08-02: 4→6ч — меньше Sonnet/Haiku при шуме bond_broken.
  # Чувствительность: средняя.
  event_debounce_hours: 6

  # Глобальный лимит событийных рефлексий — двухуровневая защита бюджета:
  # часовой лимит защищает от всплеска, суточный — от утечки бюджета.
  # 2026-08-02: ужесточено (было 30/120) после перерасхода ~$4.7/сутки vs план $0.40.
  # Чувствительность: высокая для бюджета.
  event_global_limit_per_hour: 10
  event_global_limit_per_day: 40

  # Интервал фоновой рефлексии: раз в 24 реальных часа для всех существ.
  # Примерно раз во внутреннюю неделю жизни существа (6.2).
  # Чувствительность: высокая для бюджета и глубины самосознания.
  background_interval_hours: 24

  # Плановый суточный расход на LLM-рефлексию, USD (ориентир из 7.6).
  # Жёсткий стоп очереди при достижении (см. reflection-worker budgetGate).
  llm_daily_budget_usd: 0.40

  # Модели Anthropic для рефлексии (7.3, 7.6) — ID заданы дословно заданием
  # фазы 6, свериться с актуальной страницей цен/моделей нельзя (интернет
  # недоступен в среде разработки) — см. ops/DEVIATIONS.md, фаза 6.
  # Чувствительность: низкая (это идентификаторы, не параметры баланса).
  models:
    background: claude-haiku-4-5-20251001
    event: claude-sonnet-5

  # Ориентировочная цена, USD за 1M токенов (вход/выход) — ТОЛЬКО для учёта
  # фактической стоимости вызовов в метриках (aurwin_llm_cost_usd_total,
  # recordLlmCall) и в отчётах балансировки; не влияет на поведение
  # симуляции. Порядок величины взят из 7.6 (Haiku ~$1/$5, Sonnet ~$2-3/
  # $10-15 — верхняя граница диапазона Sonnet), сверка с реальной страницей
  # цен невозможна офлайн — см. ops/DEVIATIONS.md, фаза 6.
  # Чувствительность: низкая — не влияет на баланс экосистемы, только на
  # точность оценки бюджета в отчётах.
  model_pricing_usd_per_million_tokens:
    claude-haiku-4-5-20251001: { input: 1, output: 5 }
    claude-sonnet-5: { input: 3, output: 15 }

  # Ограничения выхода LLM-рефлексии (А.5): длина self-narrative в словах,
  # максимум текущих намерений, максимум фактов-выжимок для карточки.
  # Чувствительность: низкая.
  max_narrative_words: 150
  max_intentions: 3
  max_narrative_facts: 5

  # Порог значимости эпизода для триггера ФОНОВОЙ рефлексии не нужен (она
  # безусловна раз в 24ч, background_interval_hours выше). Для СОБЫТИЙНОЙ
  # рефлексии триггерами служат конкретные ТИПЫ эпизодов, названные в 7.3
  # текстом (friend_died, hunt_success, birth, bond_formed, bond_broken,
  # matured, grew_old) — это категориальный список, а не числовой порог,
  # поэтому он не в constants.yaml, а в коде
  # (services/reflection-worker/src/queue.ts, EVENT_TRIGGER_TYPES) по тому
  # же принципу, что и TRAIT_KEYS в sim-engine (см. ops/DEVIATIONS.md, фаза 6).

  # Алёрт расхода LLM: превышение планового суточного расхода в N раз —
  # ранний сигнал утечки бюджета (А.7, А.9).
  # Чувствительность: низкая.
  llm_budget_alert_multiplier: 2

memory:
  # Лимит эпизодов в эпизодической памяти — пропорционально длине жизни вида.
  # Чувствительность: низкая.
  episodic_limit:
    penguin: 50
    orca: 80

  # Затухание значимости записи эпизодической памяти за сутки (множитель).
  # Полураспад значимости соразмерен продолжительности жизни вида.
  # Чувствительность: средняя.
  significance_decay_per_day:
    penguin: 0.90
    orca: 0.97

  # Порог значимости для перевода эпизода в core_memory (не подлежит забыванию).
  # Ключевые травмы/радости не должны исчезать со временем.
  # Чувствительность: низкая.
  core_memory_significance_threshold: 0.9

  # Затухание perceived_zone_threat за тик (было 0.15 хардкод — слишком быстро
  # для выученного «опасная бухта»). Чувствительность: высокая для обучения.
  zone_threat_decay_per_tick: 0.04

utility_ai:
  # Максимальная амплитуда случайного шума в utility-функции реактивного слоя (уровень 1).
  # Строго меньше вклада черт характера — живость поведения без потери
  # атрибутируемости решений (цель 2 раздела 2).
  # Чувствительность: средняя.
  noise_epsilon_max: 0.05

  # Стартовые (genesis) веса слагаемых U(a) (А.2/А.4/7.7: "веса решений
  # индивидуальны... + снимок при рождении"). При genesis все особи получают
  # ОДИНАКОВЫЙ снимок весов по умолчанию (6.1: "весами решений по умолчанию") —
  # индивидуальность на старте обеспечивается тем, что каждая особь владеет
  # СОБСТВЕННОЙ независимой копией (не общей ссылкой), а расхождение между
  # особями появляется позже через дрейф (реализация дрейфа — фаза 6,
  # структура данных под него заложена: weights/weights_birth + коридор выше).
  # Чувствительность: средняя.
  weight_defaults:
    w_need: { hunger: 1.0, energy: 1.0, social: 0.6, sleep: 1.0 }
    w_trait: 0.5
    w_skill: 0.4
    w_habit: 0.3

  # Сила машинно-применимых намерений зоны/совместной охоты. Намерение
  # направляет реактивный выбор, но не отменяет потребности и угрозы.
  # Чувствительность: средняя.
  intention_effects:
    zone_preference: 0.3
    hunt_with_bonus: 0.3

world:
  # Размер карты, условные единицы (у.е.). 5 именованных зон — геометрия в А.10.
  # Чувствительность: высокая — влияет на всю динамику мира.
  map:
    width: 1000
    height: 600

  # Респавн рыбы, единиц/тик, по зонам. Асимметрия между north_bay (богатая, но
  # опасная — частый заход касаток) и south_shallows (бедная, но безопасная)
  # создаёт настоящий выбор "риск/выгода" (А.9, А.10).
  # Остальные зоны (main_ice, open_water, far_ice) кормовой ценности не имеют.
  # Чувствительность: высокая — главный рычаг баланса экосистемы.
  # Изменено с 0.04/0.015 на 0.028/0.010 (−30%/−33%) при приёмке фазы 7,
  # дефект №2 (популяция вне порогов): см. ops/BALANCE_LOG.md.
  # Изменено с 0.028/0.010 на 0.020/0.007 (−29%/−30%) 2026-07-31: live-мир
  # всё ещё 178/25 при алёртах max 120/12 — следующий рычаг вниз ёмкости
  # среды без трогания численности genesis (п.9); см. ops/BALANCE_LOG.md.
  # Изменено с 0.020/0.007 на 0.012/0.004 (−40%/−43%) 2026-07-31: цель
  # среднего ≤~50 существ (≈42–45 пингвинов + 4–6 касаток) при естественной
  # регуляции; live-мир сброшен и перезапущен genesis — см. ops/BALANCE_LOG.md.
  # Изменено с 0.012/0.004 на 0.010/0.0035 (−17%/−12%) 2026-07-31:
  # offline 7d@45% (~3.15 сут) уже 132/8 > alert 120/12 после H0–H2
  # (steering/culture не трогали ёмкость — тренд роста сохранился).
  # Изменено с 0.010/0.0035 на 0.007/0.0025 (−30%/−29%) 2026-07-31:
  # offline 3d seed=42 → 141/7, 9.8% тиков вне alert (см. BALANCE_LOG).
  # 2026-08-04 realism: 0.007/0.0025 → 0.009/0.0035 — больше времени добычи в воде
  # (контакты для охоты), без подъёма base_hunt_success_probability.
  fish_respawn_per_tick:
    north_bay: 0.009
    south_shallows: 0.0035

  # Базовая вероятность успеха охоты касатки при контакте с пингвином (до
  # модификаторов навыка/сигналов/кооперации из А.10). Хищник результативен,
  # но не тотален — иначе бегство перестанет быть осмысленной стратегией.
  # Чувствительность: высокая — второй по значимости рычаг баланса.
  # Изменено с 0.35 на 0.15 при первой балансировке (см. ops/BALANCE_LOG.md,
  # фаза 4): с 0.35 и десятками контактов в сутки на 4-8 касаток genesis-
  # популяция пингвинов вымирала за 1 внутренние сутки.
  # Изменено с 0.15 на 0.20 при приёмке фазы 7, дефект №2: см. ops/BALANCE_LOG.md.
  # Изменено с 0.20 на 0.25 2026-07-31: live-мир всё ещё выше алёртов —
  # следующий шаг из BALANCE_LOG («~0.25»); см. ops/BALANCE_LOG.md.
  # Изменено с 0.25 на 0.28 2026-07-31: вместе с урезкой fish_respawn —
  # P(kill|contact) до модификаторов А.10. 2026-08-01 living-world: снова кубик
  # (было 1.0 always-kill → wipe). См. ops/BALANCE_LOG.md.
  # Чувствительность: высокая — летальность охоты.
  # 2026-08-02: 0.45→0.32 — live ~1 death/ч при 2 orca (см. BALANCE_LOG).
  # 2026-08-04: 0.32→0.28 — live тонкий (~5/2 у нижней границы alert); см. BALANCE_LOG.
  base_hunt_success_probability: 0.28

  # Именованные зоны карты и их доли площади (А.10). Порядок ниже задаёт
  # раскладку зон полосами слева направо вдоль ширины карты (см.
  # services/sim-engine/src/world/zones.ts) — сама раскладка не из ТЗ
  # дословно (там заданы только доли), см. ops/DEVIATIONS.md.
  # Чувствительность: высокая — влияет на всю пространственную динамику.
  zones:
    far_ice: { type: ice, share: 0.05 }
    main_ice: { type: ice, share: 0.30 }
    south_shallows: { type: water, share: 0.20 }
    north_bay: { type: water, share: 0.20 }
    open_water: { type: water, share: 0.25 }

social:
  # Порог силы связи (bond), с которого она считается дружбой.
  # Ниже 0.2 связь распадается. Дружба возникает не мгновенно, но достижима.
  # Чувствительность: средняя.
  friendship:
    threshold: 0.4
    decay_below: 0.2

  # Пороги отношений (А.10, "Пороги отношений"): рост силы связи за тик
  # совместного пребывания в радиусе, затухание в разлуке.
  # Чувствительность: средняя.
  bond_growth_per_tick_within_radius: 0.02
  # 2026-08-04 realism: взаимное approach/socialize/court рядом.
  bond_growth_per_tick_affiliation: 0.03
  bond_decay_per_tick_apart: 0.005
  bond_proximity_radius_units: 20

  # Избегание (aversions) возникает после травматичного эпизода со стартовой
  # силой = significance эпизода, затухание за сутки (А.10).
  # Чувствительность: средняя.
  aversion_decay_per_day: 0.01

life_stages:
  # Возрастные стадии, внутренних недель (детство/зрелость/старость) — А.9/А.10.
  # Чувствительность: средняя.
  penguin_weeks: { juvenile: 1.5, adult: 7, old: 10 }
  orca_weeks: { juvenile: 5, adult: 22, old: 30 }

  # Эффективность самокормления детёныша: множитель к успеху добычи.
  # Детёныш способен прокормиться сам, пусть и плохо — если бы он полностью
  # зависел от родителя, забота (provision, 7.9) стала бы условием выживания,
  # а не преимуществом, подлежащим отбору (7.4).
  # Чувствительность: высокая — влияет на выживаемость молодняка.
  juvenile_self_feeding_efficiency: 0.3

movement:
  # Скорость в воде, у.е./тик. Соотношение по полевым данным:
  # Adélie cruise ~2.0–2.3 м/с, burst бегства ~4 м/с; orca cruise ~2 м/с,
  # hunt burst существенно выше (десятки км/ч кратковременно). В модели
  # cruise-касатка быстрее пингвина ~2×; hunt ещё быстрее, flee даёт
  # пингвину короткий буст, но не догоняет охоту.
  # Чувствительность: высокая.
  # 2026-08-01: 7/11 → 8/16 + action multipliers (касатка должна догонять).
  water_speed:
    penguin: 8
    orca: 16

  # Скорость передвижения пингвина по льду, у.е./тик (А.10). У касаток льда
  # не бывает — поля для касатки нет. На суше ~втрое медленнее воды (WWF ~1.5 mph).
  # Чувствительность: средняя.
  ice_speed:
    penguin: 3

  # Множитель скорости в стадии "старый" — снижение подвижности с возрастом
  # (А.10), общий для обоих видов.
  # Чувствительность: средняя.
  old_age_speed_multiplier: 0.7

  # Множители действий к базовой скорости среды (реальная охота/бегство).
  # 2026-08-02: hunt 1.15→1.05, flee 1.45→1.55 — сузить разрыв orca/flee (~1.6×→~1.35×).
  action_speed_multipliers:
    hunt: 1.05
    coordinate_hunt: 1.15
    flee: 1.55
    stealth_approach: 0.55

  # Радиус «тела» в у.е. сима — separation / охота (не клиренс берега).
  # Визуальный hit на карте ≈ эти числа × MAP/SIM (1.6).
  body_radius_units:
    penguin: 10
    orca: 28

  # Стена берега: круг в центре тела, R = halfLength спрайта / 1.6.
  # orca L=84 → 27; penguin water L=32 → 10. Не пересекает лёд.
  shore_clearance_radius_units:
    penguin_water: 10
    orca: 27

  # stealth_approach: компромисс скорости и скрытности — медленнее движение
  # в обмен на заниженную воспринимаемую жертвой угрозу.
  # Чувствительность: высокая — влияет на баланс охоты.
  stealth_approach:
    speed_multiplier: 0.55
    perceived_threat_multiplier: 0.4

  # Плавное рулевое управление: ограничение поворота, инерция wander,
  # замедление у цели, гистерезис смены действия (см. ops/DEVIATIONS.md).
  # Чувствительность: средняя — влияет на «живость» траекторий.
  steering:
    max_turn_rad_per_tick: 0.7
    # Wander держит курс 16 тиков; при смене — лишь небольшой поворот, а не разворот.
    wander_persistence_ticks: 16
    wander_jitter_rad: 0.12
    # Новое действие удерживается 5 тиков, кроме немедленных flee/hunt/sleep.
    action_commit_ticks: 5
    action_hysteresis_utility: 0.18
    arrival_slow_radius_units: 20

  # Мягкое расталкивание особей — радиусы = body_radius (визуальный клиренс).
  # Hunt-пары больше не освобождаются: касание при охоте = смерть.
  # Чувствительность: средняя.
  separation:
    penguin_radius_units: 10
    orca_radius_units: 28
    iterations: 3
    max_nudge_units: 12
    # Сильнее физический сдвиг — без стопки спрайтов.
    position_nudge_multiplier: 0.85
    heading_nudge_weight: 1

decision_log:
  # Постоянный семплинг лога решений: N существ пишутся всегда + окна после
  # значимых событий, TTL записи — сутки. Без семплинга — порядка 3.9 млн
  # строк/сутки при целевой популяции.
  # Чувствительность: низкая.
  sampled_creatures_count: 10
  ttl_days: 7

skills:
  # Стартовое значение навыков при genesis/рождении — "около нуля" (6.1):
  # равномерно случайное значение в [0, genesis_initial_max].
  # Чувствительность: низкая.
  genesis_initial_max: 0.05

  # Рост навыка за успешное применение действия и потолок роста.
  # Специализация особи заметна за недели практики, но не абсолютна (7.7).
  # Чувствительность: средняя.
  growth_per_success: 0.02
  cap: 0.9

  # Затухание навыка без практики, за сутки. Не даёт навыку "прилипнуть" навсегда.
  # Чувствительность: средняя.
  decay_per_day: 0.002

  # Шаг скользящего среднего для личных оценок зон (7.7, механизм 2:
  # "обновляемая по правилу скользящего среднего"). Само число шага ТЗ не
  # даёт — только описывает правило качественно. См. ops/DEVIATIONS.md.
  # Чувствительность: средняя.
  habit_moving_average_alpha: 0.1

  # Влияние навыка на исход действия: множитель = base + skill_weight × skill.
  # Опытная особь успешнее, но новичок не беспомощен.
  # Чувствительность: средняя.
  outcome_multiplier:
    base: 0.6
    skill_weight: 0.8

  # Социальное обучение — распространение навыка через наблюдение и связи:
  # множитель к обучению для случайных очевидцев и для друзей по bond.
  # Личный опыт остаётся сильнее чужого, но опыт распространяется и формирует
  # "традиции" групп (7.7).
  # Чувствительность: высокая — формирует групповые traditions.
  social_learning:
    witness_multiplier: 0.4
    bonded_friend_multiplier: 0.25

signaling:
  # Стоимость сигнала display_vigor — доля текущего запаса энергии.
  # Гандикап-принцип: слабой особи сигнал обходится дороже, поэтому честность
  # сигнала частично поддерживается сама собой (7.8.2).
  # Чувствительность: высокая — определяет, насколько выгоден обман.
  display_vigor_cost_pct_energy: 0.08

  # Стоимость сигнала alarm_call — доля энергии; сигнал также повышает
  # заметность подающего для касаток. Ложная тревога не бесплатна.
  # Чувствительность: высокая.
  alarm_call_cost_pct_energy: 0.03

  # Числовая величина повышения заметности кричавшего для касаток на
  # несколько тиков после alarm_call (А.9 упоминает эффект текстом без
  # числа — см. ops/DEVIATIONS.md, фаза 4, тот же случай, что и у
  # guard_offspring.parent_visibility_multiplier). Применяется как
  # множитель к attractiveness() кричавшего как потенциальной жертвы.
  # Чувствительность: средняя.
  alarm_call_visibility_multiplier: 1.2
  alarm_call_visibility_duration_ticks: 5

  # Сдвиг воспринимаемого состояния (бодрости) получателем сигнала:
  # прибавка = коэффициент × доверие (trust) к отправителю.
  # Сигнал работает тем сильнее, чем больше доверия.
  # Чувствительность: высокая.
  perceived_vigor_shift_per_trust: 0.35

  # Затухание воспринимаемого состояния обратно к истинной оценке, доля за тик.
  # Обман недолговечен и требует повторения сигнала (7.8.1).
  # Чувствительность: средняя.
  perceived_state_decay_per_tick: 0.05

  # Доверие (репутация источника сигнала): рост при подтверждении сигнала,
  # падение при опровержении. Репутация теряется втрое быстрее, чем набирается —
  # это регулирует выгодность систематического обмана (7.8.4).
  # Чувствительность: высокая.
  trust:
    gain_on_confirmation: 0.05
    loss_on_refutation: 0.15
    starting_value: 0.6

  # Черта expressiveness (склонность к подаче сигналов), диапазон.
  # Наследуется и мутирует — делает склонность к сигналам предметом
  # естественного отбора (7.8.5).
  # Чувствительность: средняя.
  expressiveness_trait_range: [-1, 1]

  # Допуск для вычисления флага `honest` в signal_history рефлексии (А.5,
  # 7.8.6): |true_state - claimed_state| <= допуск считается честным
  # сигналом. Число не из А.9/А.5 дословно (текст говорит только "совпадение
  # true_state и claimed_state", не давая допуск для непрерывных величин
  # вроде vigor) — см. ops/DEVIATIONS.md, фаза 6. Для alarm_call/stealth_
  # approach true/claimed всегда ровно 0 или 1, поэтому конкретное значение
  # допуска (при условии < 1) не меняет для них исход.
  # Чувствительность: низкая — влияет только на текст, который видит LLM,
  # не на игровую механику.
  signal_honesty_tolerance: 0.15

kinship:
  # Радиус охраны потомства, у.е. — половина дневного радиуса восприятия пингвина.
  # Чувствительность: средняя.
  offspring_guard_radius_units: 30

  # Эффект guard_offspring: снижает успех охоты хищника на охраняемого детёныша
  # и одновременно повышает заметность (риск) охраняющего родителя. Забота
  # должна реально стоить риска, иначе отбор её не заметит (7.9).
  # Чувствительность: высокая.
  guard_offspring:
    offspring_hunt_success_multiplier: 0.6
    # А.9 описывает эффект текстом ("родитель — повышенную заметность для
    # касаток") без числа; булев флаг без величины неприменим в формуле
    # attractiveness() (А.4/7.8.3), поэтому заменён числовым множителем —
    # см. ops/DEVIATIONS.md, фаза 4. Множитель применяется к
    # attractiveness() охраняющего родителя как потенциальной жертвы.
    parent_visibility_multiplier: 1.3

  # Эффект coordinate_hunt: кооперативная охота отменяет групповую защиту
  # жертвы (переводит защитный множитель ×0.6 в ×1.0 для хищника).
  # Кооперация должна давать материальный выигрыш (7.9).
  # Чувствительность: высокая — влияет на баланс охоты.
  coordinate_hunt:
    # 2026-08-04 realism: 0.6→0.85 — соло-охота не наказывается как «школа всегда».
    group_defense_multiplier_without_coordination: 0.85
    group_defense_multiplier_with_coordination: 1.0

  # Глубина проверки родства при отборе партнёра/цели заботы: 1 поколение
  # (только прямые потомки). Полный родственный отбор — вне MVP (7.9).
  # Чувствительность: низкая.
  kinship_check_depth_generations: 1

day_night:
  # Радиус восприятия днём/ночью, у.е. Ночь опаснее для зрения, но эхолокация
  # касатки страдает меньше, чем зрение пингвина (7.10).
  # Чувствительность: высокая — влияет на ночную смертность.
  perception_radius:
    penguin: { day: 60, night: 35 }
    orca: { day: 100, night: 75 }

  # Дальность слуха (alarm_call / пробуждение) — диск, не зрение. По умолчанию = дневное зрение.
  hearing_radius:
    penguin: 60
    orca: 100

  # Множитель восприятия у спящей особи. Полусон китообразных (0.5) означает,
  # что спящий хищник не становится полностью беззащитным.
  # Чувствительность: высокая.
  asleep_perception_multiplier:
    penguin: 0.1
    orca: 0.5

  # Доступность рыбы ночью, множитель. Делает ночную кормёжку невыгодной —
  # у сна появляется экономический смысл (7.10).
  # Чувствительность: средняя.
  night_fish_availability_multiplier: 0.7

  # Восстановление энергии во время сна, множитель к обычному отдыху.
  # Сон должен окупать риск уязвимости во время сна.
  # Чувствительность: средняя.
  sleep_energy_recovery_multiplier: 2

  # Черта chronotype (склонность засыпать раньше/позже), диапазон.
  # Наследуется и мутирует; разброс хронотипов даёт естественных "дозорных"
  # без отдельной механики (7.10) — без разброса вся колония засыпала бы разом.
  # Чувствительность: высокая.
  chronotype_trait_range: [-1, 1]

  # Давление сна: рост за сутки бодрствования, снижение за сутки сна.
  # Полный цикл накопления/разрядки укладывается во внутренние сутки.
  # Чувствительность: средняя.
  sleep_pressure:
    gain_per_day_awake: 3.4
    loss_per_day_asleep: 10

  # Штраф усталости при давлении сна выше порога: множители к навыкам и скорости.
  # Невыспавшееся существо хуже добывает пищу и хуже спасается от хищника (7.10).
  # Чувствительность: средняя.
  fatigue_penalty:
    sleep_pressure_threshold: 0.7
    skill_multiplier: 0.8
    speed_multiplier: 0.85

retention:
  # Политика ретенции данных (docs/AURWIN_TZ.md, А.2, абзац "ПОЛИТИКА РЕТЕНЦИИ").
  # Эти значения не входят в таблицу А.9 дословно (они из текста А.2), но по
  # тому же правилу CLAUDE.md п.3 ("все константы симуляции — только в конфиге")
  # вынесены сюда, а не зашиты в скрипты обслуживания (services/db/src/maintenance).
  # Чувствительность: низкая — это сроки хранения, а не параметры баланса экосистемы.

  # episodes: полное удаление эпизодов через N реальных суток после смерти существа
  # (независимо от прунинга по значимости/лимиту при жизни).
  episodes_days_after_death: 30

  # world_events: полное хранение N реальных суток, далее сворачивание в
  # суточные агрегаты (world_events_daily_agg) вместо построчного хранения.
  world_events_full_days: 90

  # reflections: request/response (аудит промптов) обнуляются через N суток;
  # метаданные (kind, status, created_at, applied_at) хранятся без ограничения.
  reflections_audit_days: 30

  # signals: полное построчное хранение N суток, далее — только агрегаты
  # (доля неподтверждённых сигналов по видам, signals_daily_agg).
  signals_full_days: 30

needs_rates:
  # Скорость изменения потребностей за реальные сутки при ускорении ×7
  # (А.10, "Потребности"). sleep_pressure — уже в day_night.sleep_pressure.
  # Чувствительность: высокая — определяет весь темп жизненного цикла.
  hunger_gain_per_day: 0.5
  energy_loss_active_per_day: 0.4
  energy_gain_rest_per_day: 0.8
  social_gain_per_day_alone: 0.3

  # Смерть от голода при hunger = 1.0, продержавшемся непрерывно N реальных
  # часов (А.10).
  # Чувствительность: высокая.
  starvation_death_after_hours: 6

reproduction:
  # Условия и параметры размножения (7.4). Пороги значений — не из таблицы
  # А.9 дословно (раздел 9 прямо называет их открытым вопросом инженерии:
  # "точные пороги... условий размножения... потребуют балансировки на
  # реальных прогонах") — стартовые числа для балансировки, см.
  # ops/DEVIATIONS.md и ops/BALANCE_LOG.md.
  # Чувствительность: высокая — прямо определяет темп роста популяции.

  # "Сыты выше порога" — голод должен быть НИЖЕ этого значения у обоих партнёров.
  max_hunger_to_mate: 0.4

  # "Положительная связь достаточной силы" — используем тот же порог, что и
  # для дружбы (social.friendship.threshold), но отдельной константой —
  # порог размножения и порог дружбы концептуально разные вещи и могут
  # разойтись при балансировке.
  min_bond_strength_to_mate: 0.4

  # Вероятность зачатия за тик при выполнении всех условий (сытость, связь,
  # оба взрослые, разнополые, не родственники до 2 поколений — 7.4).
  # 2026-08-04: 0.02→0.01 вместе с cooldown 2→3 после birth-only-mate.
  attempt_probability_per_tick: 0.01

  # Запрет повторного размножения той же особи раньше, чем через N
  # внутренних суток — защита от вырожденного взрывного роста численности.
  # 2026-08-04: 2→3 после фикса birth-only-mate (см. BALANCE_LOG).
  cooldown_inner_days: 3

  # Мутация черт/черт-модификаторов потомства: нормальное отклонение,
  # прибавляемое к среднему родительских значений, с последующим clamp
  # к диапазону черты (второй механизм поддержания разнообразия, 7.4).
  trait_mutation_stddev: 0.08
  chronotype_mutation_stddev: 0.1
  expressiveness_mutation_stddev: 0.1

  # Мягкая культурная передача при рождении: детёныш получает лишь часть
  # усреднённого опыта родителей, сохраняя пространство для личной практики.
  # Чувствительность: средняя.
  culture_inherit:
    habit_weight: 0.55
    habit_noise_amplitude: 0.1
    weights_blend: 0.2
    skill_seed: 0.2
    # Доля родительского уточнения поверх видового innate seed.
    instinct_parent_overlay: 0.25
    zone_threat_seed: 0.35
    aversion_seed: 0.25

foraging:
  # А.4 задаёт форму "P(успех кормёжки) = base × (0.6 + 0.8×foraging)", но
  # само `base` нигде не названо числом (в отличие от охоты — 0.35 есть
  # дословно). Кормёжка из плотности рыбы (не бинарная охота) реалистично
  # успешнее одиночной атаки хищника на жертву, поэтому base выше, чем у
  # охоты. См. ops/DEVIATIONS.md, фаза 4.
  # Чувствительность: высокая — определяет лёгкость прокорма пингвинов.
  base_success_probability: 0.7

  # Расход плотности рыбы за один приём пищи — дословная цифра А.10
  # ("Один приём пищи пингвина расходует 0.02 плотности локально"), просто
  # не названная как отдельная строка в табл. А.9.
  meal_fish_density_amount: 0.02

  # Снижение голода (needs.hunger) за один успешный приём пищи — не задано
  # числом в ТЗ; подобрано так, чтобы полностью проголодавшийся пингвин
  # (hunger=1) насытился за несколько (не один) успешных приёмов пищи.
  hunger_reduction_per_meal: 0.3

hunting:
  # Контакт снова вероятностный (А.10); pre_contact + notice остаются.
  # Чувствительность: высокая.

  # Воспринимаемая угроза касатки у пингвина (flee / alarm). Floor — минимум
  # при видимости; старт threat берётся из instincts.species_affect.orca.
  # Чувствительность: высокая — читаемость драмы хищник↔жертва.
  prey_threat:
    baseline: 0.45
    visible_floor: 0.45
    hunt_bump: 0.9
    flee_proximity_weight: 1.0
    # Вычитается из U(socialize/approach/court), пока касатка в радиусе.
    social_suppress: 0.75

  # Радиус физического касания. 2026-08-02: 22→16 — реже бросок кубика.
  # 2026-08-04 realism: 16→18 — больше реализованных контактов при том же P.
  contact_radius_units: 18

  # Удача до контакта: полоса срыва + notice→flee.
  # group/guard вместо ×P дают отталкивание; coordinate отменяет срыв.
  pre_contact:
    approach_band_extra_units: 16
    defense_nudge_units: 20
    break_cooldown_ticks: 8

  # Кулдаун повторной попытки охоты ТОЙ ЖЕ касатки на ТУ ЖЕ жертву — после
  # срыва сближения (не после «промаха кубика на контакте»).
  # Чувствительность: высокая — прямой рычаг летальности охоты.
  # 2026-08-04 realism: 30→20 — короче окно после срыва погони.
  reattempt_cooldown_real_minutes: 20

  juvenile_prey_multiplier: 1.6
  old_prey_multiplier: 1.3
  noticed_in_advance_multiplier: 0.5
  hungry_hunter_multiplier: 1.15
  # Голод касатки, начиная с которого она считается "голодной" для
  # модификатора hungry_hunter_multiplier (число не из А.9 дословно —
  # необходимо для операционализации текстового "голодная касатка").
  hungry_hunter_hunger_threshold: 0.5

  # Базовая вероятность того, что жертва "заметит касатку заранее" —
  # триггер commit flee до контакта + ×noticed_in_advance_multiplier к P(kill).
  # 2026-08-02: 0.65→0.75 — раньше commit flee к берегу.
  # 2026-08-04 realism: 0.75→0.65 — flee не почти-гарантирован.
  notice_in_advance_base_probability: 0.65

  # Стартовые (genesis) веса формулы attractiveness() касатки (А.4/7.8.3):
  # w_vigor индивидуален и дрейфует (скепсис к сигналам, 7.8.4) — структура
  # под дрейф заложена (weights.hunt_attractiveness + weights_birth), сам
  # дрейф — фаза 6, как и прочие веса (см. utility_ai.weight_defaults).
  # Чувствительность: высокая.
  attractiveness_weight_defaults:
    w_vigor: 0.4
    w_dist: 0.3
    w_group: 0.2
    w_stage: 0.1
  juvenile_stage_bonus: 1.0
  adult_stage_bonus: 0.0

  # Снижение голода касатки за одну успешную охоту — не задано числом в
  # ТЗ; выбрано существенно больше, чем один рыбный приём пищи пингвина
  # (одна добыча кормит основательнее одного захода за рыбой).
  hunger_reduction_per_kill: 0.6

  # Прирост давления сна/энергии от `provision` — успех кормления
  # детёныша родителем зависит от навыка parenting (7.9): не задан числом
  # в ТЗ, реализован как вероятность успеха передачи еды.
  provision_base_success_probability: 0.6
  provision_hunger_reduction: 0.25

# Врождённые инстинкты (priors) — seed при genesis/birth. Не сценарии действий:
# задают силу чувств; U(a) и обучение решают стратегию.
instincts:
  penguin:
    species_affect:
      orca: { threat: 0.85, value: 0.0 }
      penguin: { threat: 0.0, value: 0.2 }
    need_drive:
      hunger_seek_food: 0.55
      hunger_seek_prey: 0.0
    medium_bias:
      land: 0.18
      water: -0.06
  orca:
    species_affect:
      penguin: { threat: 0.0, value: 0.8 }
      orca: { threat: 0.0, value: 0.25 }
    need_drive:
      hunger_seek_food: 0.0
      hunger_seek_prey: 0.6
    medium_bias:
      land: -0.9
      water: 0.12

episode_significance:
  # Стартовая значимость эпизодов памяти по типу события. Не выписаны в
  # табл. А.9 как отдельные числа (тип памяти определяет значимость
  # содержательно: "смерть друга" примерно 0.8-0.9 упоминается в А.2/А.5
  # как пример core_memory), но без числа для КАЖДОГО типа события
  # прунинг/забывание (А.2) нереализуем. См. ops/DEVIATIONS.md.
  # Чувствительность: средняя.
  friend_died: 0.9
  hunt_success: 0.5
  # А.10: промах "травматичен для жертвы (significance ~0.8)".
  hunt_attempt_survived_by_prey: 0.8
  # А.10: промах — "неудача" для охотника (менее значима, чем для жертвы).
  hunt_attempt_failed_by_hunter: 0.4
  birth: 0.6
  bond_formed: 0.3
  bond_broken: 0.3
  matured: 0.5
  grew_old: 0.5
  signal_disconfirmed_against_me: 0.4
  woken_by_alarm: 0.2

api:
  # Защита публичного API (А.6): эндпоинты открыты без авторизации — лимиты
  # обязательны. Числа — дословная цитата раздела А.6, не выписаны в табл.
  # А.9 отдельными строками; вынесены сюда по тому же правилу CLAUDE.md п.3,
  # что и retention (фаза 2) — единый источник правды для ЛЮБОГО числа,
  # включая лимиты доступа, а не только числа баланса экосистемы.
  # Чувствительность: низкая — это защита инфраструктуры, а не параметр баланса.

  # REST: не более N запросов/мин с одного IP.
  rest_rate_limit_per_minute: 60

  # GET /api/social-graph кэшируется на N сек (тяжёлый ответ, меняется медленно).
  social_graph_cache_seconds: 10

  # WebSocket: одновременных соединений с одного IP.
  # ТЗ А.6: «не более 3» — на практике за Caddy + реконнекты/зомби-сокеты
  # 3 давало ложный «мир сейчас популярен» уже при 1–2 вкладках. Поднято
  # до 8; при переполнении api-gateway вытесняет самое старое соединение IP
  # (см. services/api-gateway/src/ws.ts), а не отказывает новому.
  # Чувствительность: низкая (инфраструктура).
  ws_max_connections_per_ip: 8

  # Отключение неактивных WS-соединений через N минут.
  # Было 30 — слишком долго держало полуоткрытые сокеты в лимитере.
  ws_idle_timeout_minutes: 3
  # Серверный лимит ОБЩЕГО числа одновременных WS-соединений — А.6 требует
  # "graceful-отказ при перегрузке... вместо падения api-gateway", но не
  # называет число (см. ops/DEVIATIONS.md, фаза 5). Значение — инженерный
  # запас для одного процесса Node.js на MVP-нагрузке одного observer-сайта;
  # подлежит пересмотру при реальном трафике.
  ws_max_total_connections: 500

authority:
  # Формула авторитетности особи как источника знания (для социального
  # обучения, 7.7): половина веса — прожитый возраст относительно
  # максимального для вида, половина — профильный навык. Ценен не возраст
  # сам по себе, а прожитый с толком.
  # Чувствительность: средняя.
  formula:
    age_weight: 0.5
    profile_skill_weight: 0.5

  # Вес авторитетности при передаче знания/традиции: множитель = 0.5 + 0.5 × authority.
  # Опыт старших весит больше, но не подавляет личный опыт получателя.
  # Чувствительность: средняя.
  transmission_weight:
    base: 0.5
    authority_weight: 0.5

  # Пересчёт авторитетности — раз во внутренние сутки, а не каждый тик:
  # величина меняется медленно, ежетиковый пересчёт был бы пустой нагрузкой.
  # Чувствительность: низкая.
  recompute_interval: "per_inner_day"

# Пороги алёртов эксплуатации (А.7, фаза 7 «Эксплуатация») — не входят в
# табл. А.9 дословно построчно (кроме population.alert_thresholds, который
# уже вынесен выше), но по тому же правилу CLAUDE.md п.3 ("любое число, не
# только баланс экосистемы" — см. также секции retention/api) собраны здесь,
# а не зашиты в ops/observability/prometheus/alerts.yml. Prometheus не умеет
# импортировать сторонний YAML как переменные — сами alert-правила читают
# буквальные числа, ЗЕРКАЛЬНЫЕ этим константам; при изменении здесь нужно
# вручную поправить и alerts.yml (см. комментарий там же).
alerting:
  # Остановка тик-цикла sim-engine дольше N секунд (А.7: "> 2 мин").
  # Чувствительность: низкая.
  tick_stall_seconds: 120

  # Доля вызовов LLM-рефлексии с исходом "ошибка" за скользящий час (А.7).
  # Чувствительность: низкая.
  llm_error_rate_threshold: 0.5

  # Плановый суточный расход на LLM-рефлексию (А.9: "~$0.40/день план") и
  # множитель, при превышении которого срабатывает ранний сигнал утечки
  # бюджета (А.7: "> 2х планового").
  # Чувствительность: низкая.
  llm_daily_cost_budget_usd: 0.40
  llm_daily_cost_alert_multiplier: 2
