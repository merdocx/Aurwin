name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # engines: >=20; 22 LTS — без deprecation Node 20 на runners.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Vitest globalSetup поднимает ephemeral postgres:16-alpine через Docker
      # (tests/setup/global-db-setup.ts). На ubuntu-latest Docker уже есть.
      - name: Test
        run: npm test
